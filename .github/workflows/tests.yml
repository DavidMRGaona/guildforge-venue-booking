name: Tests

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run it makes obsolete
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: DavidMRGaona/GuildForge/.github/workflows/reusable-module-tests.yml@main
    with:
      module_name: 'venue-bookings'
      # Host branch, tag or SHA to test against (main when the variable is unset)
      host_ref: ${{ vars.GUILDFORGE_HOST_REF || 'main' }}
    permissions:
      contents: read

  # The Vue tests (tests/js) run inside the core, whose sources the components import through '@/'
  vue:
    name: Vue tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout host application
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ vars.GUILDFORGE_HOST_REF || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            src/resources/js

      - name: Checkout module
        uses: actions/checkout@v7
        with:
          path: src/modules/venue-bookings
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/modules/venue-bookings/package-lock.json

      - name: Install host dependencies
        working-directory: src
        run: npm ci

      - name: Install module dependencies
        working-directory: src/modules/venue-bookings
        run: npm ci

      - name: Run Vue tests
        working-directory: src/modules/venue-bookings
        run: npm test
